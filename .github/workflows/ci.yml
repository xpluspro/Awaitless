name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Compile package
        run: python -m compileall -q src

      - name: Run unit and CLI tests
        run: python -m unittest discover -s tests -v

  quality:
    name: Lint, package, and installed-wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install quality tooling
        run: python -m pip install -e . build ruff==0.15.21 twine

      - name: Run Ruff
        run: ruff check src tests benchmarks scripts metric

      - name: Validate checked-in evidence
        run: |
          python -m json.tool assets/demo-session.json >/dev/null
          python -m json.tool assets/mcp-slurm-demo.json >/dev/null
          python -m json.tool benchmarks/results/polling-vs-awaitless.json >/dev/null
          python -m json.tool metric/configs/smoke.json >/dev/null
          python -m json.tool metric/configs/evidence-local.json >/dev/null
          python -m json.tool metric/configs/agent-smoke.json >/dev/null
          python -m json.tool metric/configs/agent-evidence.json >/dev/null
          python -m json.tool metric/configs/long-running-smoke.json >/dev/null
          python -m json.tool metric/configs/long-running-demo.json >/dev/null
          python -m json.tool metric/configs/long-running-evidence.json >/dev/null
          python -m json.tool metric/configs/long-running-model-smoke.json >/dev/null
          python -m json.tool metric/qualitative/review-template.json >/dev/null
          python -m json.tool metric/schemas/trial.schema.json >/dev/null
          python -m json.tool metric/schemas/long-running-trial.schema.json >/dev/null
          python benchmarks/polling_vs_awaitless.py --help >/dev/null
          python metric/run_local.py --help >/dev/null
          python metric/analyze.py --help >/dev/null
          python metric/run_agent.py --help >/dev/null
          python metric/run_long_running.py --help >/dev/null
          python metric/analyze_long_running.py --help >/dev/null
          python metric/long_workload.py --help >/dev/null
          python metric/run_long_running.py --config metric/configs/long-running-smoke.json --probe-only >/dev/null
          python metric/baselines/tmux_job.py --help >/dev/null
          python scripts/create_demo_gif.py --help >/dev/null
          python scripts/mcp_slurm_demo.py --help >/dev/null

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata and README
        run: twine check dist/*

      - name: Test the installed wheel
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python scripts/smoke_installed_wheel.py

      - name: Store validated distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
