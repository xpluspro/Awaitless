name: Release Awaitless

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit and CLI tests
        run: python -m unittest discover -s tests -v

  build:
    name: Build and validate distribution
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install release tooling
        run: >-
          python -m pip install --disable-pip-version-check
          build ruff==0.15.21 twine

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = f"v{metadata['project']['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          PY

      - name: Run Ruff
        run: ruff check src tests scripts metric

      - name: Validate MCP Registry metadata
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher validate server.json

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check package metadata and README
        run: twine check dist/*

      - name: Test the installed wheel
        run: |
          python -m venv .wheel-smoke
          .wheel-smoke/bin/python -m pip install dist/*.whl
          .wheel-smoke/bin/python scripts/smoke_installed_wheel.py

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/awaitless-runner
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Create release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${RELEASE_TAG#v}"
          awk -v heading="## ${version} " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          gh release create "$RELEASE_TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "Awaitless $RELEASE_TAG" \
            --verify-tag \
            --notes-file release-notes.md

  mcp-registry:
    name: Publish to official MCP Registry
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install MCP publisher
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Authenticate with GitHub Actions OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish Registry metadata after PyPI propagation
        env:
          SERVER_NAME: io.github.xpluspro/awaitless
          SERVER_VERSION: ${{ github.ref_name }}
        run: |
          SERVER_VERSION="${SERVER_VERSION#v}"
          for attempt in $(seq 1 18); do
            if curl -fsSL --get \
              --data-urlencode "search=$SERVER_NAME" \
              https://registry.modelcontextprotocol.io/v0.1/servers \
              | jq -e --arg name "$SERVER_NAME" --arg version "$SERVER_VERSION" \
                '.servers[]? | select(.server.name == $name and .server.version == $version)' \
                >/dev/null; then
              echo "$SERVER_NAME $SERVER_VERSION is already published"
              exit 0
            fi
            if ./mcp-publisher publish server.json; then
              exit 0
            fi
            echo "Registry publish attempt $attempt is waiting for PyPI propagation"
            sleep 10
          done
          echo "MCP Registry publication did not succeed after 18 attempts" >&2
          exit 1
