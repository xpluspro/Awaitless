[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "awaitless-runner"
version = "0.3.0"
description = "Durable queued MCP Tasks for local, SSH, and Slurm infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Awaitless contributors" }]
dependencies = [
  "mcp>=2.0,<3",
  "tomli>=2.0.1; python_version < '3.11'",
]
keywords = ["ai-agents", "cli", "durable-jobs", "job-queue", "mcp", "slurm", "ssh", "task-runner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/xpluspro/Awaitless"
Documentation = "https://github.com/xpluspro/Awaitless/tree/main/docs"
Repository = "https://github.com/xpluspro/Awaitless.git"
Issues = "https://github.com/xpluspro/Awaitless/issues"

[project.scripts]
awaitless = "awaitless.cli:main"
awaitless-mcp = "awaitless.mcp_server:main"
# Matching the distribution name lets MCP Registry clients launch the stdio
# server directly with `uvx awaitless-runner`.
awaitless-runner = "awaitless.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
